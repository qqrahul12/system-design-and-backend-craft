<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#6d28d9" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>
    <linearGradient id="filmGlow" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="32" y1="8" x2="56" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg)" />
  <rect x="2" y="2" width="60" height="60" rx="16" stroke="#a78bfa" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Cinema Ticket / Film Frame -->
  <path d="M14 20C14 17.7909 15.7909 16 18 16H46C48.2091 16 50 17.7909 50 20V44C50 46.2091 48.2091 48 46 48H18C15.7909 48 14 46.2091 14 44V20Z" fill="#180e29" stroke="url(#filmGlow)" stroke-width="2" />
  
  <!-- Film Sprocket Perforations -->
  <rect x="18" y="19" width="4" height="4" rx="1" fill="#c084fc" />
  <rect x="26" y="19" width="4" height="4" rx="1" fill="#c084fc" />
  <rect x="34" y="19" width="4" height="4" rx="1" fill="#c084fc" />
  <rect x="42" y="19" width="4" height="4" rx="1" fill="#c084fc" />

  <rect x="18" y="41" width="4" height="4" rx="1" fill="#c084fc" />
  <rect x="26" y="41" width="4" height="4" rx="1" fill="#c084fc" />
  <rect x="34" y="41" width="4" height="4" rx="1" fill="#c084fc" />
  <rect x="42" y="41" width="4" height="4" rx="1" fill="#c084fc" />

  <!-- Cinema Play Triangle -->
  <polygon points="26,26 26,38 37,32" fill="url(#filmGlow)" />

  <!-- AI Sparkle Star -->
  <path d="M48 9C48 14 44 18 39 18C44 18 48 22 48 27C48 22 52 18 57 18C52 18 48 14 48 9Z" fill="url(#sparkleGrad)" filter="url(#glow)" />
  <circle cx="48" cy="18" r="1.5" fill="#ffffff" />
</svg>
