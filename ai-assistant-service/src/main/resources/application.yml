server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: ai-assistant-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://cinemind-low-grain.bulrush.cloud.layerbase.dev:5432/cinemind?sslmode=require}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:3}
      minimum-idle: ${HIKARI_MIN_IDLE:1}
      idle-timeout: 60000
      max-lifetime: 300000
      connection-timeout: 30000
      keepalive-time: 30000
      validation-timeout: 3000
  sql:
    init:
      mode: ${SPRING_SQL_INIT_MODE:always}
      schema-locations: classpath:schema.sql
      continue-on-error: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:cinecache-numb-cross.bulrush.cloud.layerbase.dev}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      username: ${SPRING_DATA_REDIS_USERNAME:default}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      database: 0
      ssl:
        enabled: true

  # Disable unused auto-configurations
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration

# Provider API Keys & Base URLs
ai:
  gemini:
    api-key: ${GEMINI_API_KEY:your-gemini-api-key-here}
    base-url: https://generativelanguage.googleapis.com/v1beta/openai
    model: gemini-3.8-flash
    temperature: 0.7
  groq:
    api-key: ${GROQ_API_KEY:your-groq-api-key-here}
    base-url: https://api.groq.com/openai
    model: qwen/qwen3.8-27b
    temperature: 0.2

logging:
  level:
    com.skills.ai: DEBUG
    org.springframework.ai: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true


